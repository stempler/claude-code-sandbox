###############################################################################
# docker-compose.yml — Claude Code Sandbox
#
# Minimal sandboxed environment for Claude Code with:
#   - Default-deny egress firewall (only Anthropic API reachable)
#   - Locked permission settings (agent cannot modify its own rules)
#   - Non-root user with scoped sudo
#   - Only your source code mounted (no infra, credentials, etc.)
#
# Usage:
#   1. docker compose build
#   2. docker compose run claude-dev bash        # interactive
#   3. docker compose run claude-dev claude -p "fix the bug" --max-turns 30
###############################################################################

services:
  claude-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-sandbox
    cap_add:
      - NET_ADMIN               # Required for iptables inside container
    volumes:
      # Mount your source code — adjust path as needed
      - ../src:/workspace
      # Persistent Claude session state (OAuth token, conversation history)
      - claude-state:/home/devuser/.claude
      # Git config (read-only)
      - ./gitconfig-sandbox:/home/devuser/.gitconfig:ro
      #
      # !! NEVER ADD THESE !!
      # - /var/run/docker.sock   → container escape
      # - ~/.ssh                 → SSH key theft
      # - ~/.aws                 → AWS credential theft
      # - ../.env                → secrets
    environment:
      GIT_AUTHOR_NAME: "Claude Code (sandbox)"
      GIT_AUTHOR_EMAIL: "claude-sandbox@localhost"
      GIT_COMMITTER_NAME: "Claude Code (sandbox)"
      GIT_COMMITTER_EMAIL: "claude-sandbox@localhost"
      # DO NOT set ANTHROPIC_API_KEY — use subscription auth instead
    working_dir: /workspace
    stdin_open: true
    tty: true
    pids_limit: 100
    mem_limit: 4g
    cpus: 2.0

volumes:
  claude-state:
